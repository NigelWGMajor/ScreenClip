<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Selection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      background: transparent;
      outline: none; /* Remove focus outline */
    }
    
    #screenshot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* Hide screenshot so user sees live desktop with borders */
    }
    
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 70, 140, 0.22);
      border: 5px solid rgba(0, 170, 255, 0.95);
      box-shadow:
        inset 0 0 18px rgba(0, 170, 255, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      z-index: 900;
    }
    
    #selection {
      position: absolute;
      border: 3px solid #00aaff;
      background: rgba(0, 160, 255, 0.22);
      pointer-events: none;
      display: none;
      z-index: 1000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.9),
        0 0 16px rgba(0, 170, 255, 0.95);
    }
    
    #selection.selectable {
      pointer-events: auto;
      cursor: pointer;
    }
    
    #selection.selectable:hover {
      border-color: #00a0ff;
      background: rgba(0, 160, 255, 0.25);
      box-shadow: 0 0 15px rgba(0, 160, 255, 0.7);
    }
    
    #instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body tabindex="-1">
  <!-- Instructions banner removed for cleaner UI. Re-add if onboarding is needed. -->
  <!-- <div id="instructions">Drag to select area → Click inside selection to confirm → Click outside to redrag → ESC to cancel</div> -->
  <img id="screenshot" />
  <div id="overlay"></div>
  <div id="selection"></div>
  
  <script src="selection.js"></script>
</body>
</html>
